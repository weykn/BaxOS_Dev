# Folders that stand in for other folders.
#
# A program off a Linux system looks where Linux keeps things; these send it
# where this disk keeps them instead. The swap happens inside the filesystem,
# so one line holds for reading, writing, listing and deleting alike - and
# for every command and program, not only the one that wanted it.
#
#   remap <folder> <folder>     the first stands for the second
#   remap remove <folder>       and stops standing for it
#   remap                       lists them
#
# There is room for eight, and the first one that covers a path is the one
# that applies.

# What a program writes for itself: ~/.config/<name> lands in /conf/pkg/<name>,
# beside the rest of the configuration rather than loose in the root.
remap /.config /conf/pkg
remap /.local /conf/pkg
# The system's own settings, which is what /conf/sys already is.
remap /etc /conf/sys
# A Linux root's home is the one home there is.
remap /root /home
# Programs, and the libraries they were linked against.
remap /bin /pkg/linux-coreutils
remap /usr/bin /pkg/linux-coreutils
remap /lib /pkg/linux-coreutils/lib
